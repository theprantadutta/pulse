name: pulse
description: "Pulse — network diagnostics for desktop and mobile."

publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.4.0

  # State, routing, persistence
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path: ^1.9.1

  # Network
  dart_ping: ^10.0.1
  ffi: ^2.2.0
  http: ^1.6.0
  network_info_plus: ^8.2.1
  connectivity_plus: ^7.3.1
  permission_handler: ^13.0.2
  package_info_plus: ^10.2.1
  flutter_dotenv: ^6.0.1

  # Map
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Brand
  flutter_svg: ^2.3.0

  # Background, tray, notifications
  flutter_local_notifications: ^22.3.1
  flutter_foreground_task: ^11.0.3
  tray_manager: ^0.7.0
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2

  # Export / links / formatting
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  intl: ^0.20.3
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  msix: ^3.18.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/brand/svg/
    - assets/brand/logo/
    - assets/brand/in_app/
    - assets/brand/splash/
    - assets/brand/icon/windows/
    - assets/data/
    - assets/brand/tray/
    - .env

  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
    - family: WireGlyphs
      fonts:
        - asset: assets/fonts/WireGlyphs.ttf

msix_config:
  # Store identity (identity_name, publisher, publisher_display_name) comes
  # from Partner Center > Product identity; see CLAUDE.md "Microsoft Store".
  display_name: Pulse
  publisher_display_name: Pranta Dutta
  identity_name: com.pranta.pulse
  msix_version: 2.0.0.0
  description: Network diagnostics and monitoring - ping, traceroute, port scan, speed test, LAN scan and alerts.
  languages: en-us
  logo_path: assets/brand/icon/master/pulse_icon_light_1024.png
  capabilities: internetClient,privateNetworkClientServer,location
  output_name: pulse
  # Launch at login for the packaged app (registry Run keys are virtualised
  # inside a package). Must match kTaskId in windows/runner/startup_task.cpp.
  startup_task:
    task_id: PulseStartup
    enabled: false
    parameters: --autostart
  # Lets toast notifications activate the app. clsid = the guid passed to
  # WindowsInitializationSettings in lib/services/background/notifications.dart.
  toast_activator:
    clsid: 6f1c2c4e-8a2b-4c61-9d5e-2b7a0f3e91c4
    arguments: -ToastActivated
    display_name: Pulse
