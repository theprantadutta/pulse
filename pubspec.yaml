name: pulse
description: "Pulse — network diagnostics for desktop and mobile."

publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0

  # State, routing, persistence
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  shared_preferences: ^2.5.6
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path: ^1.9.1

  # Network
  dart_ping: ^10.0.1
  ffi: ^2.2.0
  http: ^1.6.0
  network_info_plus: ^8.2.2
  connectivity_plus: ^7.3.2
  permission_handler: ^13.0.2
  package_info_plus: ^10.2.2
  # Brand
  flutter_native_splash: ^2.4.8
  flutter_svg: ^2.3.4

  # Background, tray, notifications
  flutter_local_notifications: ^23.0.1
  flutter_foreground_task: ^11.0.3
  nativeapi: ^0.6.0
  tray_manager: ^0.9.0
  window_manager: ^0.7.0
  screen_retriever: ^0.4.0

  # Export / links / formatting
  file_picker: ^13.3.3
  url_launcher: ^6.3.3
  intl: ^0.20.3
  timezone: ^0.11.2
  firebase_core: ^5.1.0
  cupertino_ui: ^1.1.6
  dynamic_color: ^2.1.0
  crypto: ^3.0.8
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  vm_service: ^15.4.0
  flutter_lints: ^6.0.0
  test: ^1.32.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  msix: ^3.18.0
  flutter_launcher_icons: ^0.14.4

# dart_ping 10 still pins code_assets ^1.2.1, which blocks the nativeapi family
# (tray_manager, window_manager, screen_retriever) that needs ^2.1.0. dart_ping
# only uses it in its iOS build hook. Drop this once dart_ping allows 2.x.
dependency_overrides:
  code_assets: ^2.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/icon/windows/
    - assets/brand/tray/
    - assets/icons/
    - assets/data/

  fonts:
    - family: RobotoFlex
      fonts:
        - asset: assets/fonts/RobotoFlex-Variable.ttf

msix_config:
  # Store identity (identity_name, publisher, publisher_display_name) comes
  # from Partner Center > Product identity; see CLAUDE.md "Microsoft Store".
  display_name: Pulse
  publisher_display_name: Pranta Dutta
  identity_name: com.pranta.pulse
  msix_version: 1.0.1.0
  description: Network diagnostics and monitoring - ping, traceroute, port scan, speed test, LAN scan and alerts.
  languages: en-us
  logo_path: assets/brand/icon/master/pulse_icon_rounded_1024.png
  capabilities: internetClient,privateNetworkClientServer,location
  output_name: pulse
  # Launch at login for the packaged app (registry Run keys are virtualised
  # inside a package). Must match kTaskId in windows/runner/startup_task.cpp.
  startup_task:
    task_id: PulseStartup
    enabled: false
    parameters: --autostart
  # Lets toast notifications activate the app. clsid = the guid passed to
  # WindowsInitializationSettings in lib/services/background/notifications.dart.
  toast_activator:
    clsid: 6f1c2c4e-8a2b-4c61-9d5e-2b7a0f3e91c4
    arguments: -ToastActivated
    display_name: Pulse
